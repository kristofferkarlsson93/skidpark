appId: com.krikar.skidpark.skidpark.e2e
name: Skid- och testlivscykel
tags:
  - e2e
---
- launchApp:
    clearState: true
    permissions:
      location: allow
- runFlow: _helpers/wait_for_home_ready.yaml

- tapOn:
    id: "navigation-skis"
- runFlow:
    file: _helpers/create_ski.yaml
    env:
      SKI_NAME: "Parkskida"

- tapOn:
    id: "navigation-tests"
- tapOn: "Skapa mitt första test"
- assertVisible: "[\\s\\S]*1 av 1 valda"
- tapOn: "Lägg till ny skida"
- tapOn:
    id: "ski-name-field"
- inputText: "Testskida"
- pressKey: back
- assertVisible: "Avbryt"
- tapOn: "Lägg till"
- assertVisible: "[\\s\\S]*2 av 2 valda"
- scrollUntilVisible:
    element:
      text: "Avbryt"
    direction: DOWN
- tapOn: "Avbryt"

- tapOn: "Ingen"
- assertVisible: "[\\s\\S]*0 av 2 valda"
- tapOn: "Alla"
- assertVisible: "[\\s\\S]*2 av 2 valda"

- tapOn:
    id: "glide-test-name-field"
- eraseText
- inputText: "Livscykeltest"
- hideKeyboard
- assertNotVisible: "Anteckningar"
- tapOn: "Skapa test"
- assertVisible: "Nytt åk"
- tapOn:
    id: "test-info-edit-notes"
- inputText: "2026-10-30 -5"
- hideKeyboard
- tapOn: "Spara"
- assertVisible: "[\\s\\S]*2026-10-30 -5[\\s\\S]*"

- tapOn: "Fler alternativ"
- assertNotVisible: "Redigera testinfo"
- assertVisible: "Exportera all data"
- back
- tapOn: "Ändra skidor"
- assertVisible: "Skidor i testet"
- assertNotVisible: "Livscykeltest"
- assertNotVisible: "2026-10-30 -5"
- assertVisible: "[\\s\\S]*2 av 2 valda"

- tapOn: "Parkskida"
- assertVisible: "[\\s\\S]*1 av 2 valda"
- scrollUntilVisible:
    element:
      text: "Lägg till ny skida"
    direction: DOWN
- tapOn: "Lägg till ny skida"
- tapOn:
    id: "ski-name-field"
- inputText: "Ersättningsskida"
- pressKey: back
- assertVisible: "Avbryt"
- tapOn: "Lägg till"
- assertVisible: "[\\s\\S]*2 av 3 valda"
- scrollUntilVisible:
    element:
      text: "Stäng"
    direction: DOWN
- tapOn: "Stäng"
- tapOn: "Spara skidurval"
- assertVisible: "Nytt åk"
- assertVisible: "Livscykeltest"
- assertVisible: "[\\s\\S]*2026-10-30 -5[\\s\\S]*"
- tapOn: "Nytt åk"
# Fresh Google Play emulators can require their initial location setup here.
- extendedWaitUntil:
    visible: "Välj skida för åket|For a better experience[\\s\\S]*"
    timeout: 15000
- runFlow:
    when:
      visible: "For a better experience[\\s\\S]*"
    commands:
      - tapOn: "Turn on"
- assertVisible: "Välj skida för åket"
- assertVisible: "Testskida"
- assertVisible: "Ersättningsskida"
- assertNotVisible: "Parkskida"
- back

- tapOn: "Fler alternativ"
- tapOn: "Radera glidtestet"
- assertVisible: "Radera \"Livscykeltest\"?"
- tapOn: "Radera"
- assertVisible: "Testet raderat"
- assertNotVisible: "Livscykeltest"

- tapOn:
    id: "navigation-skis"
- assertVisible: "Parkskida"
- assertVisible: "Testskida"
- assertVisible: "Ersättningsskida"
